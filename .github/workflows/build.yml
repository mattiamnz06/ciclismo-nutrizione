name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ciclismo-nutrizione.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ciclismo-nutrizione.apk --title "Ultima build" \
            --notes "APK di debug generato da $GITHUB_SHA. Installa sul telefono e consenti le app da origini sconosciute."
